# Temporary HTTP-only vhost (Certbot will upgrade to HTTPS)
upstream silicon_nexus {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    server_name silinex.xyz www.silinex.xyz;

    client_max_body_size 1m;

    location / {
        proxy_pass http://silicon_nexus;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/silinex.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/silinex.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.silinex.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = silinex.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name silinex.xyz www.silinex.xyz;
    return 404; # managed by Certbot




}