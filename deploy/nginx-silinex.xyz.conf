# silinex.xyz HTTPS vhost
# After deploy, reload nginx (do not skip):
#   sudo nginx -t && sudo systemctl reload nginx
#
# www.silinex.xyz 301s to https://silinex.xyz$request_uri before proxying.
# Apex keeps the current reverse-proxy behavior.

upstream silicon_nexus {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name www.silinex.xyz;

    ssl_certificate /etc/letsencrypt/live/silinex.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/silinex.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://silinex.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name silinex.xyz;

    client_max_body_size 1m;

    location / {
        proxy_pass http://silicon_nexus;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    ssl_certificate /etc/letsencrypt/live/silinex.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/silinex.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name silinex.xyz www.silinex.xyz;
    return 301 https://silinex.xyz$request_uri;
}
